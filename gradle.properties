# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Tuned for 16GB RAM: 6GB heap, 1GB Metaspace, G1GC with parallel ref processing & string deduplication
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# Parallel mode and multi-worker compilation (tuned for 6-core/12-thread CPU)
org.gradle.parallel=true
org.gradle.workers.max=8

# Build caching and daemon optimization
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Kotlin compiler optimizations (K2 multi-threading, classpath snapshot)
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.parallel.tasks.in.project=true
kotlin.compiler.execution.strategy=in-process

# KSP incremental processing
ksp.incremental=true
ksp.use.caches=true

# Android Gradle Plugin optimizations
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.defaults.buildfeatures.shaders=false
